<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form Placeholder for Netlify Forms</title>
</head>
<body>
  <!-- This file is a static placeholder designed to allow Netlify's build-time html-parser to discover and register the contact form, which is dynamically rendered at runtime via server-side rendering (SSR). -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" netlify>
    <input type="hidden" name="form-name" value="contact" />
    <p class="hidden">
      <label>Don’t fill this out if you’re human: <input name="bot-field" /></label>
    </p>
    <input type="text" name="first-name" />
    <input type="text" name="last-name" />
    <input type="email" name="email" />
    <input type="text" name="subject" />
    <textarea name="message"></textarea>
    <button type="submit">Submit</button>
  </form>
</body>
</html>
