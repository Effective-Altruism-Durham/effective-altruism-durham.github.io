# Pages CMS configuration (https://pagescms.org). Editors sign in at
# https://app.pagescms.org (with GitHub, or by email once invited as a collaborator) and
# their saves are committed to `main`, which redeploys the site.
#
# Fields here must match the schema in src/content.config.ts: a build that fails
# validation never deploys.

media:
  input: public/uploads
  output: /uploads
  categories: [image]

content:
  - name: team
    label: Committee
    description: The people listed on the Contact Us page. Tick "Past member" when someone leaves to move them to the alumni list.
    type: collection
    path: content/team-members
    format: json
    filename: "{fields.name}.json"
    view:
      primary: name
      fields: [name, roles, order, alumni]
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: order
        label: Display order
        description: Lower numbers appear first.
        type: number
        required: true
      - name: name
        label: Name
        type: string
        required: true
      - name: roles
        label: Roles
        description: Separate roles with commas, e.g. "President, 1-1 Advisor".
        type: string
        required: true
      - name: email
        label: Email
        description: Leave empty for past members; it is not shown for them.
        type: string
      - name: image
        label: Photo
        description: Optional. A square photo works best; it is shown as a circle.
        type: image
      - name: bio
        label: Bio
        description: One or two sentences. Not shown for past members.
        type: text
        required: true
      - name: alumni
        label: Past member
        description: Tick when someone leaves the committee. They move to the "See alumni" list, which shows their roles but not their email or bio.
        type: boolean
        default: false
      - name: years
        label: Years on committee
        description: Optional, past members only, e.g. "2023–2025".
        type: string
      - name: now
        label: Now
        description: Optional, past members only. What they do now, e.g. "Research Analyst at GiveWell".
        type: string
      - name: link
        label: Link
        description: Optional, past members only. A LinkedIn or personal website address.
        type: string
