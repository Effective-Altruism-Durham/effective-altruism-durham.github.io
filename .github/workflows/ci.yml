name: CI

# Build gate for PRs (including Dependabot bumps). The live deploy only runs on push to main,
# so a red check here keeps a broken change off eadurham.org.
#
# Builds the Astro site only (`build:astro-only`): `tinacms build` needs the Tina Cloud
# secrets, which GitHub doesn't pass to Dependabot or fork PRs. The deploy workflow runs the
# full `pnpm run build`.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel a stale PR run when new commits arrive; keep every run on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm run build:astro-only
